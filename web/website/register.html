<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VinylVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/styles.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400&display=swap" rel="stylesheet">

</head>
<body class="login-page">

<nav class="navbar navbar-expand navbar-dark bg-dark fixed-top">
	<div class="container-fluid flex-nowrap">
		<a class="navbar-brand" href="/welcome" style="padding-top: 0">
            <img src="/static/data/other/VVlogo_solo_cr.png" alt="VivylVault Logo" class="navbar-logo rounded-3">
        </a>
	</div>
</nav>

<div class="d-flex justify-content-center align-items-center vv-full-screen">
    <div class="container" style="max-width: 500px">
        <h2 class="text-center text-danger no-select" style="font-family: Barlow;">Create your account</h2>
        <p id="form-error" class="alert alert-danger" hidden
           data-exists="Пользователь с таким именем уже есть"
           data-badusername="Username может содержать только буквы, цифры, точку, дефис и _, и не может быть user"
           data-email="Укажите корректный email"
           data-emailused="Email уже зарегистрирован"
           data-password="Пароль не может быть пустым"
           data-server="Не удалось создать аккаунт. Попробуйте позже."></p>
        <form action="/register" method="POST">
            <div class="form-group">
                <input type="text" class="form-control mb-2" name="username" placeholder="Username" required minlength="1">
            </div>
            <div class="form-group">
                <input type="password" class="form-control mb-2" name="password" placeholder="Password" required minlength="1">
            </div>
            <div class="form-group">
                <input type="email" class="form-control mb-2" name="email" aria-describedby="emailHelp" placeholder="Email" required>
            </div>
        <button type="submit" class="btn btn-primary">Submit</button>
        </form>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/form-error.js"></script>
<script src="/static/script.js"></script>

</body>
</html>
