services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: vinyl_fast_api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    env_file:
      - .env
    environment:
      MONGO_URI: "mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin&directConnection=true"
      TZ: Europe/Moscow
    ports:
      - "8000:8000"

  # 27017
  mongo:
    image: mongo:8
    restart: unless-stopped
    command: ["mongod", "--quiet"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: "${MONGO_ROOT_USER}"
      MONGO_INITDB_ROOT_PASSWORD: "${MONGO_ROOT_PASSWORD}"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "-u", "${MONGO_ROOT_USER}",
          "-p", "${MONGO_ROOT_PASSWORD}",
          "--authenticationDatabase", "admin",
          "--quiet",
          "--eval", "db.adminCommand('ping').ok",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo-express:
    image: mongo-express
    profiles: ["dev"]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin&directConnection=true"
      ME_CONFIG_SITE_BASEURL: /mongo
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: "${MONGO_EXPRESS_USER}"
      ME_CONFIG_BASICAUTH_PASSWORD: "${MONGO_EXPRESS_PASSWORD}"
      ME_CONFIG_SITE_COOKIESECRET: "${ME_COOKIE_SECRET}"
      ME_CONFIG_SITE_SESSIONSECRET: "${ME_SESSION_SECRET}"

volumes:
  mongo_data:

# docker compose up --build
# Mongo auth: MONGO_ROOT_* in .env (init only on first empty volume)
# mongo-express UI: http://localhost:8081/mongo  (MONGO_EXPRESS_*)
# If auth was added after an old volume: docker compose down -v  (wipes DB data)
